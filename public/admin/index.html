<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Arlow admin</title>
<style>
:root{--bg:#0c0c10;--bg2:#15151b;--bg3:#1d1d26;--line:#2a2a36;--tx:#f4f4f8;--mut:#a8a8b8;--pu:#8b5cf6;--bl:#4f7cff;--ok:#7ee2a8;--er:#ff8a8a}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx)}.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 4%;background:rgba(12,12,16,.95);border-bottom:1px solid var(--line)}
.sp{flex:1}
.b{background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;transition:.2s}
.b:hover{border-color:var(--pu)}.b:active{transform:scale(.96)}.b.pri{background:linear-gradient(120deg,var(--pu),var(--bl));border-color:transparent}.b.sm{padding:4px 12px;font-size:.85rem}.b.dg:hover{border-color:var(--er);color:var(--er)}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:14px 4% 0}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--mut);cursor:pointer}
nav button[aria-current=true]{color:var(--tx);border-color:var(--pu)}
#view{padding:20px 4% 80px;max-width:980px}
h2{font-size:1.5rem;margin-bottom:6px}h3{margin:22px 0 8px}
label{display:grid;gap:4px;margin:10px 0;font-size:.88rem;color:var(--mut)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input:hover,select:hover,textarea:hover{border-color:#4a4a63}input:focus,select:focus,textarea:focus{border-color:var(--pu);outline:none}
textarea{min-height:90px;resize:vertical}input[type=checkbox]{width:auto}
details{background:var(--bg2);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 14px}
summary{cursor:pointer;padding:12px 0;display:flex;gap:8px;align-items:center}summary b{flex:1}
.tag{font-size:.75rem;padding:2px 9px;border-radius:99px;background:var(--bg3);border:1px solid var(--line);color:var(--mut)}.tag.ok{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{display:block;font-size:1.7rem}
.img img{max-width:240px;max-height:140px;border-radius:8px;display:block;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.note{border-left:3px solid var(--pu);background:var(--bg2);padding:12px 14px;border-radius:0 10px 10px 0;color:var(--mut);margin:12px 0;font-size:.9rem}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login[hidden],#app[hidden]{display:none}
#lf{width:min(380px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:28px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);padding:10px 18px;border-radius:12px;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}#toast.er{border-color:var(--er);color:var(--er)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="login" hidden><form id="lf"><h1>ARLOW admin</h1><p id="lmsg" class="mut" style="margin:8px 0"></p>
<label>Password<input id="pw" type="password" autocomplete="current-password" required></label><button class="b pri" style="width:100%;margin-top:8px">Log in</button></form></main>
<div id="app" hidden>
 <header><strong>ARLOW admin</strong><span id="st" class="mut"></span><span class="sp"></span>
  <button class="b" id="sv">Save draft</button><button class="b pri" id="pb">Publish</button><button class="b" id="lo">Log out</button></header>
 <nav id="tabs" aria-label="Sections"></nav><section id="view"></section>
</div>
<div id="toast" role="status" aria-live="polite"></div><iframe id="exp" title="import" hidden></iframe>
<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a))x==="class"?e.className=v:e[x]=v;k.flat().forEach(c=>c!=null&&e.append(c));return e};
const uid=()=>crypto.randomUUID().replace(/-/g,"").slice(0,12);
let C=null,dirty=false,unpub=false,tab="ov",tt;
function toast(m,er){const t=$("#toast");t.textContent=m;t.className="on"+(er?" er":"");clearTimeout(tt);tt=setTimeout(()=>t.className="",er?6000:3500)}
async function api(path,o={}){
  const r=await fetch("/api/admin/"+path,{credentials:"same-origin",...o,headers:{"X-Admin":"1",...(o.headers||{})}});
  let d={};try{d=await r.json()}catch{}
  if(!r.ok){const e=new Error(d.error||"Request failed ("+r.status+")");e.status=r.status;throw e}return d}
const num=v=>{const m=String(v||"").trim().replace(/,/g,"").match(/^([\d.]+)\s*([kKmM])?$/);return m?parseFloat(m[1])*({k:1e3,m:1e6}[(m[2]||"").toLowerCase()]||1):0};
const blank=()=>({projects:[],thumbnails:[],socials:[],services:[],featuredId:"",accepting:true,availability:"",config:{discordInvite:""},auralis:{trailerUrl:"",lore:"",recruitment:"",recruitStatus:"",recruitUrl:"",discordInvite:"",episodes:[],news:[]},growth:{labels:[],values:null},goals:[]});
function mark(){dirty=true;unpub=true;status()}
function status(){$("#st").textContent=dirty?"Unsaved changes":unpub?"Draft saved, not published":"Live site matches your draft"}
const set=(o,k,v)=>{o[k]=v;mark()};

/* ---- image compression: max 1280px, under ~250 KB, WebP (or JPEG if unsupported) ---- */
const IT=(()=>{const c=document.createElement("canvas");c.width=c.height=1;return c.toDataURL("image/webp").startsWith("data:image/webp")?"image/webp":"image/jpeg"})();
async function shrink(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw new Error("Use a JPG, PNG or WebP image.");
  const bmp=await createImageBitmap(file);
  for(const sc of [1,.8,.6,.45]){
    const f=Math.min(1,1280/Math.max(bmp.width,bmp.height))*sc,cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.round(bmp.width*f));cv.height=Math.max(1,Math.round(bmp.height*f));
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    for(const q of [.85,.7,.55,.4]){const b=await new Promise(r=>cv.toBlob(r,IT,q));if(b&&b.size<=250*1024)return b}}
  throw new Error("Could not shrink this image under 250 KB. Try a simpler or smaller image.")}

/* ---- generic list editor ---- */
const EX=[["#portfolio","Editing portfolio"],["#thumbnails","Thumbnails & design"],["#auralis","Auralis SMP"]],ST=[["Available","Available"],["Limited","Limited spots"],["Unavailable","Unavailable"]];
const SC={
 projects:{t:"title",get:()=>C.projects,f:[["title","Title","text"],["category","Category (e.g. Football, Minecraft, Cinematic)","text"],["video","Video URL (YouTube links play on the site; other links open as a link)","url"],["url","Link to original video (optional)","url"],["thumb","Thumbnail image (optional)","img"],["desc","Description","area"]],blank:{title:"New project",category:"Other",video:"",url:"",thumb:"",desc:""}},
 thumbnails:{t:"title",get:()=>C.thumbnails,f:[["title","Title","text"],["desc","Description (shown in the preview)","text"],["src","Image","img"]],blank:{title:"New thumbnail",desc:"",src:""}},
 socials:{t:"platform",get:()=>C.socials,f:[["platform","Platform","text"],["username","Username","text"],["url","Profile URL","url"],["followers","Followers (e.g. 1200 or 1.2K)","text"],["views","Total views (optional)","text"],["videos","Video count (optional)","text"],["icon","Profile image or icon (optional)","img"]],blank:{platform:"New account",username:"",url:"",followers:"",views:"",videos:"",icon:""}},
 services:{t:"name",get:()=>C.services,f:[["name","Service name","text"],["desc","Description","area"],["price","Price or starting price (leave blank if unset)","text"],["features","What's included (one per line)","lines"],["example","Examples link","sel",EX],["status","Availability","sel",ST]],blank:{name:"New service",desc:"",price:"",features:[],example:"#portfolio",status:"Available"}},
 episodes:{t:"title",get:()=>C.auralis.episodes,f:[["title","Episode title","text"],["desc","Description","area"],["video","Video URL (YouTube)","url"],["url","Link to watch (optional)","url"],["thumb","Episode thumbnail (optional)","img"]],blank:{title:"New episode",desc:"",video:"",url:"",thumb:""}},
 news:{t:"title",get:()=>C.auralis.news,f:[["title","Headline","text"],["body","Announcement","area"],["date","Date label (e.g. 12 Nov)","text"]],blank:{title:"New announcement",body:"",date:""}}
};
function field(o,[k,label,type,opts]){
  const w=el("label",{},label);let i;
  if(type==="img"){
    i=el("div",{class:"img"});const pv=el("img",{alt:""}),u=()=>{pv.src=o[k]||"";pv.hidden=!o[k]};u();
    const f=el("input",{type:"file",accept:"image/jpeg,image/png,image/webp"});
    f.onchange=async()=>{if(!f.files[0])return;try{toast("Compressing and uploading…");const b=await shrink(f.files[0]);const r=await api("upload",{method:"POST",body:b,headers:{"Content-Type":b.type}});set(o,k,r.src);u();toast("Uploaded ("+Math.round(b.size/1024)+" KB). Save draft to keep it.")}catch(e){toast(e.message,1)}f.value=""};
    i.append(pv,f,el("button",{type:"button",class:"b sm",onclick:()=>{set(o,k,"");u()}},"Remove image"));
  }else if(type==="sel"){i=el("select");opts.forEach(([v,t])=>i.append(new Option(t,v)));i.value=o[k]||opts[0][0];i.onchange=()=>set(o,k,i.value)}
  else if(type==="area"||type==="lines"){i=el("textarea");i.value=type==="lines"?(o[k]||[]).join("\n"):o[k]||"";i.oninput=()=>set(o,k,type==="lines"?i.value.split("\n"):i.value)}
  else{i=el("input",{type:type==="url"?"url":"text"});i.value=o[k]||"";i.oninput=()=>set(o,k,i.value)}
  w.append(i);return w}
function listView(key,extra){
  const s=SC[key],arr=s.get(),box=el("div"),draw=(openIdx)=>{
    box.replaceChildren();
    arr.forEach((o,i)=>{
      const d=el("details",{open:i===openIdx}),name=()=>o[s.t]||"Untitled";
      d.append(el("summary",{},el("b",{},name()),o.hidden?el("span",{class:"tag"},"Hidden"):null,key==="projects"&&C.featuredId===o.id?el("span",{class:"tag ok"},"Featured"):null));
      s.f.forEach(f=>d.append(field(o,f)));
      const mv=(n)=>()=>{const j=i+n;if(j<0||j>=arr.length)return;arr.splice(j,0,arr.splice(i,1)[0]);mark();draw()};
      d.append(el("div",{class:"row"},
        el("button",{class:"b sm",onclick:mv(-1)},"Move up"),el("button",{class:"b sm",onclick:mv(1)},"Move down"),
        key==="projects"?el("button",{class:"b sm",onclick:()=>{C.featuredId=o.id;mark();draw(i)}},"Make featured"):null,
        el("button",{class:"b sm",onclick:()=>{o.hidden=!o.hidden;mark();draw(i)}},o.hidden?"Show on site":"Hide from site"),
        el("button",{class:"b sm dg",onclick:()=>{if(confirm('Delete "'+name()+'" permanently? It disappears from the site when you publish and cannot be undone.')){arr.splice(i,1);mark();draw()}}},"Delete")));
      box.append(d)});
    if(!arr.length)box.append(el("p",{class:"mut"},"Nothing here yet."))};
  draw();
  return el("div",{},extra||null,el("button",{class:"b pri",onclick:()=>{arr.push({...JSON.parse(JSON.stringify(s.blank)),id:uid(),hidden:false});mark();draw(arr.length-1)}},"Add new"),box)}
const tf=(o,k,l,t="text")=>field(o,[k,l,t]);

/* ---- tabs ---- */
const TABS=[["ov","Overview"],["projects","Projects"],["thumbnails","Thumbnails"],["socials","Socials"],["services","Services"],["auralis","Auralis SMP"],["stats","Statistics"],["log","Changes"]];
function go(t){tab=t;$("#tabs").replaceChildren(...TABS.map(([k,l])=>el("button",{"aria-current":String(k===t),onclick:()=>go(k)},l)));const v=$("#view");v.replaceChildren();views[t](v)}
const views={
 async ov(v){
  const vs=a=>a.filter(x=>!x.hidden).length,fo=C.socials.reduce((a,s)=>a+num(s.followers),0),vw=C.socials.reduce((a,s)=>a+num(s.views),0),fmt=n=>Math.round(n).toLocaleString("en-GB");
  v.append(el("h2",{},"Overview"),el("div",{class:"kpis"},...[["Projects",vs(C.projects)+" / "+C.projects.length],["Thumbnails",vs(C.thumbnails)+" / "+C.thumbnails.length],["Social accounts",vs(C.socials)+" / "+C.socials.length],["Total followers",fmt(fo)],["Total views",fmt(vw)]].map(([l,n])=>el("div",{class:"kpi"},el("b",{},n),l))),
   el("p",{class:"mut"},"Counts show visible / total. Followers and views are the numbers you typed in Socials. Nothing is estimated."),
   el("div",{class:"row"},el("button",{class:"b pri",onclick:()=>{go("projects");$("#view button.b.pri").click()}},"Add project"),el("button",{class:"b",onclick:()=>{go("thumbnails");$("#view button.b.pri").click()}},"Upload thumbnail"),el("button",{class:"b",onclick:()=>go("stats")},"Edit statistics")));
  if(!C.projects.length&&!C.thumbnails.length)v.append(el("div",{class:"note"},"Your draft is empty. Click below to copy the content currently built into your website (the placeholders) into the dashboard so you can edit it. Nothing goes live until you Publish. ",el("button",{class:"b sm",onclick:doImport},"Import current site content")));
  v.append(el("h3",{},"Recent changes"));const t=el("div",{class:"mut"},"Loading…");v.append(t);
  try{const r=await api("log");t.replaceWith(logTable(r.rows.slice(0,5)))}catch(e){t.textContent=e.message}},
 projects:v=>v.append(el("h2",{},"Editing projects"),el("p",{class:"mut"},"Add a YouTube link and it plays on your site. Hidden projects stay in the dashboard but are not published."),listView("projects")),
 thumbnails:v=>v.append(el("h2",{},"Thumbnails & images"),el("div",{class:"note"},"Images are resized in your browser to max 1280px and under about 250 KB (hard server limit 300 KB, 200 images in total). Unused images are cleaned up when you publish."),listView("thumbnails")),
 socials:v=>v.append(el("h2",{},"Social accounts"),tf(C.config,"discordInvite","Main Discord invite link (used by the Discord buttons)","url"),listView("socials")),
 services:v=>{const a=el("label",{},"Currently accepting commissions"),c=el("input",{type:"checkbox",checked:C.accepting});c.onchange=()=>set(C,"accepting",c.checked);a.append(c);
  v.append(el("h2",{},"Services & Hire Me"),a,tf(C,"availability","Availability message shown on the site (optional)"),listView("services"))},
 auralis(v){const A=C.auralis;
  v.append(el("h2",{},"Auralis SMP"),tf(A,"trailerUrl","Trailer URL (YouTube)","url"),tf(A,"lore","Lore","area"),
   field(A,["recruitStatus","Recruitment status","sel",[["","Not shown"],["Open","Open"],["Closed","Closed"],["Invite only","Invite only"]]]),
   tf(A,"recruitment","Recruitment text","area"),tf(A,"recruitUrl","Application URL","url"),tf(A,"discordInvite","Auralis Discord invite","url"),
   el("h3",{},"Episodes"),listView("episodes"),el("h3",{},"News & announcements"),listView("news"))},
 stats(v){
  const G=C.growth,gt=el("textarea",{placeholder:"Jan, 1200\nFeb, 1800"});gt.value=(G.values||[]).map((n,i)=>G.labels[i]+", "+n).join("\n");
  gt.oninput=()=>{const rows=gt.value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\s*,\s*/));G.labels=rows.map(r=>r[0]);G.values=rows.length?rows.map(r=>r[1]===undefined?"":r[1]):null;mark()};
  while(C.goals.length<3)C.goals.push({label:"",current:"",target:""});
  v.append(el("h2",{},"Statistics"),el("div",{class:"note"},"All figures here are typed by you and labelled \"Entered by hand\" on the site. The counters on the site add up the followers, views and video counts from your Socials tab, and count your visible projects. Anything left empty stays a clearly labelled sample. Automatic YouTube stats come in Stage 2."),
   el("h3",{},"View growth chart"),el("p",{class:"mut"},"One month per line as: Label, Views. Leave empty to keep the labelled sample chart."),gt,
   el("h3",{},"Goals (need a label, current and target to show)"),...C.goals.map(g=>el("div",{class:"row"},...[["label","Goal name"],["current","Current"],["target","Target"]].map(([k,l])=>{const w=el("label",{style:"flex:1;min-width:120px"},l),i=el("input",{type:"text",value:g[k]??""});i.oninput=()=>set(g,k,i.value);w.append(i);return w}))))}
 ,
 async log(v){v.append(el("h2",{},"Change log"));const t=el("p",{class:"mut"},"Loading…");v.append(t);try{t.replaceWith(logTable((await api("log")).rows))}catch(e){t.textContent=e.message}}
};
const logTable=rows=>rows.length?el("table",{},el("tr",{},el("th",{},"When"),el("th",{},"Action"),el("th",{},"Details")),...rows.map(r=>el("tr",{},el("td",{},new Date(r.at).toLocaleString()),el("td",{},r.action),el("td",{},r.detail||"")))):el("p",{class:"mut"},"No changes recorded yet.");

/* ---- import the built-in site content (read from the public page, never from a server secret) ---- */
async function doImport(){
  if(!confirm("Copy the content built into your website into this draft? This replaces your current draft."))return;
  try{
    const got=new Promise((res,rej)=>{const h=e=>{if(e.origin===location.origin&&e.data&&e.data.arlowDefaults){removeEventListener("message",h);res(e.data.arlowDefaults)}};addEventListener("message",h);setTimeout(()=>rej(new Error("Could not read the public site.")),8000)});
    $("#exp").src="/?arlow-export=1";const D=await got,yt=id=>id?"https://www.youtube.com/watch?v="+id:"",c=blank();
    c.projects=D.PROJECTS.map(p=>({id:uid(),hidden:false,title:p.title,category:p.category,video:yt(p.youtubeId),url:p.url||"",thumb:p.thumb||"",desc:p.desc||""}));
    c.thumbnails=D.THUMBNAILS.map(t=>({id:uid(),hidden:false,title:t.title,desc:"",src:t.src||""}));
    c.socials=D.SOCIALS.map(s=>({id:uid(),hidden:false,platform:s.platform,username:s.username,url:s.url||"",followers:s.followers||"",views:s.views||"",videos:s.videos||"",icon:""}));
    c.services=D.SERVICES.map(s=>({id:uid(),hidden:false,name:s.name,desc:s.desc,price:s.price||"",features:s.features||[],example:s.example||"#portfolio",status:"Available"}));
    c.config.discordInvite=D.CONFIG.discordInvite||"";const A=D.AURALIS;
    Object.assign(c.auralis,{trailerUrl:yt(A.trailerYoutubeId),lore:A.lore||"",recruitment:A.recruitment||"",recruitUrl:D.CONFIG.recruitUrl||"",discordInvite:D.CONFIG.auralisDiscord||"",episodes:(A.episodes||[]).map(e=>({id:uid(),hidden:false,title:e.title,desc:"",video:yt(e.youtubeId),url:e.url||"",thumb:""}))});
    C=(await api("import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:c})})).draft;
    dirty=false;unpub=true;status();go("ov");toast("Imported into your draft. Review it, then Publish.")
  }catch(e){toast(e.message,1)}}

/* ---- save / publish / login ---- */
async function save(){
  const r=await api("content",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(C)});
  dirty=false;status();return r}
$("#sv").onclick=async()=>{try{await save();toast("Draft saved.")}catch(e){toast(e.message,1)}};
$("#pb").onclick=async()=>{if(!confirm("Publish now? This updates the live website for everyone."))return;
  try{await save();await api("publish",{method:"POST"});unpub=false;status();toast("Published. The live site now shows your changes.")}catch(e){toast(e.message,1)}};
$("#lo").onclick=async()=>{if(dirty&&!confirm("You have unsaved changes. Log out anyway?"))return;dirty=false;try{await api("logout",{method:"POST"})}catch{}location.reload()};
addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
$("#lf").onsubmit=async e=>{e.preventDefault();try{await api("login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});$("#pw").value="";boot()}catch(er){$("#lmsg").textContent=er.message}};
async function boot(){
  try{
    await api("me");const r=await api("content");
    C=Object.assign(blank(),r.draft||{});C.auralis=Object.assign(blank().auralis,C.auralis);C.config=Object.assign({discordInvite:""},C.config);
    unpub=!r.hasPublished||r.dirty;dirty=false;$("#login").hidden=true;$("#app").hidden=false;status();go("ov")
  }catch(e){$("#app").hidden=true;$("#login").hidden=false;$("#lmsg").textContent=e.status===401?"":e.message}}
boot();
</script></body></html>
